{% extends 'store/base.html' %}

{% block content %}
<!-- Se agregó un contenedor para centrar y darle apariencia de tarjeta (Card) -->
<div class="max-w-sm mx-auto mt-10 p-6 bg-white border border-gray-200 rounded-lg shadow-md">
    
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h2>

    <!-- Se utiliza flexbox para manejar el espaciado interno automáticamente -->
    <form method="POST" class="flex flex-col gap-4">
        {% csrf_token %}
        
        <input type="text" name="username" placeholder="Usuario" 
               class="w-full px-4 py-2 border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
        
        <input type="password" name="password" placeholder="Contraseña" 
               class="w-full px-4 py-2 border border-gray-300 rounded-md text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">

        <button type="submit" 
                class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition-colors">
            Ingresar
        </button>
    </form>

</div>
{% endblock %}
