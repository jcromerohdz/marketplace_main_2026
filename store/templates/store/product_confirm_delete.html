{% extends 'store/base.html' %}

{% block content %}
<!-- Contenedor centrado tipo tarjeta (Modal/Dialog simulado) -->
<div class="max-w-md mx-auto mt-16 p-8 bg-white border border-gray-200 rounded-lg shadow-sm text-center">
    
    <!-- Ícono de advertencia (SVG de Tailwind Heroicons) para mejorar la UX -->
    <div class="flex justify-center mb-4">
        <svg class="w-14 h-14 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
    </div>

    <!-- Título y mensaje de confirmación -->
    <h3 class="text-xl font-bold text-gray-900 mb-2">¿Eliminar producto?</h3>
    <p class="text-gray-600 mb-8">
        Estás a punto de eliminar <span class="font-bold text-gray-800">"{{ product.name }}"</span>. Esta acción no se puede deshacer.
    </p>

    <!-- Botones alineados con Flexbox -->
    <form method="POST" class="flex justify-center gap-3">
        {% csrf_token %}
        
        <a href="{% url 'dashboard' %}" 
           class="px-5 py-2 bg-white border border-gray-300 rounded-md text-gray-700 font-medium hover:bg-gray-50 transition-colors">
            Cancelar
        </a>
        
        <button type="submit" 
                class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium transition-colors">
            Sí, eliminar
        </button>
    </form>

</div>
{% endblock %}
