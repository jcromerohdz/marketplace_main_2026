<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marketplace</title>

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<nav class="bg-gray-900">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <a class="text-xl font-bold text-white no-underline" href="/">Marketplace</a>

    <div class="flex items-center space-x-3">
      <a href="{% url 'cart_detail' %}"
        class="border border-gray-300 text-gray-300 hover:bg-white hover:text-gray-900 px-3 py-1.5 rounded text-sm transition-colors">
           Carrito
      </a>
      {% if user.is_authenticated and user.is_seller %}
        <a href="{% url 'dashboard' %}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-medium px-3 py-1.5 rounded text-sm transition-colors">Dashboard</a>
      {% endif %}
      {% if user.is_authenticated %}
        <span class="text-white">Hola {{ user.username }}</span>
        <a href="{% url 'logout' %}" class="border border-gray-300 text-gray-300 hover:bg-white hover:text-gray-900 px-3 py-1.5 rounded text-sm transition-colors">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="border border-gray-300 text-gray-300 hover:bg-white hover:text-gray-900 px-3 py-1.5 rounded text-sm transition-colors">Login</a>
        <a href="{% url 'register' %}" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm transition-colors">Registro</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mx-auto px-4 mt-6">
    {% block content %}{% endblock %}
</div>

</body>
</html>
